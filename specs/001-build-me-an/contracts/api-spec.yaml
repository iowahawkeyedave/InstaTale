openapi: 3.0.3
info:
  title: AI Instagram Content Creator API
  description: REST API for AI-powered Instagram caption and hashtag generation
  version: 1.0.1
  contact:
    name: InstaTale API Support

servers:
  - url: https://api.instatale.app/v1
    description: Production server
  - url: http://localhost:8000/v1
    description: Development server

paths:
  /sessions:
    post:
      summary: Create new processing session
      description: Initialize a new session for image upload and processing
      operationId: createSession
      responses:
        '201':
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions/{sessionId}/upload:
    post:
      summary: Upload image for processing
      description: Upload an image file to be analyzed by AI
      operationId: uploadImage
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: Image file (JPEG, PNG, HEIC, WebP)
              required:
                - image
      responses:
        '202':
          description: Upload accepted, processing started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Invalid file or file too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Session not found or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions/{sessionId}/status:
    get:
      summary: Get processing status
      description: Check the current status of image processing
      operationId: getStatus
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions/{sessionId}/content:
    get:
      summary: Get generated content
      description: Retrieve AI-generated caption and hashtags
      operationId: getContent
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Content retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentResponse'
        '404':
          description: Session not found or no content available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '425':
          description: Processing not complete yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions/{sessionId}/regenerate:
    post:
      summary: Regenerate content
      description: Generate new caption and hashtags for the same image
      operationId: regenerateContent
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                style:
                  type: string
                  enum: [casual, professional, engaging, funny]
                  description: Caption style preference
                  default: engaging
      responses:
        '202':
          description: Regeneration started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegenerateResponse'
        '404':
          description: Session not found or no image analyzed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    SessionResponse:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
          description: Unique session identifier
        created_at:
          type: string
          format: date-time
          description: Session creation timestamp
        expires_at:
          type: string
          format: date-time
          description: Session expiration timestamp
        upload_url:
          type: string
          format: uri
          description: URL for image upload
      required:
        - session_id
        - created_at
        - expires_at
        - upload_url

    UploadResponse:
      type: object
      properties:
        upload_id:
          type: string
          format: uuid
          description: Unique upload identifier
        status:
          type: string
          enum: [UPLOADING, PROCESSING]
          description: Current processing status
        estimated_completion:
          type: string
          format: date-time
          description: Estimated completion time
      required:
        - upload_id
        - status

    StatusResponse:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [UPLOADING, PROCESSING, COMPLETED, FAILED, EXPIRED]
          description: Current processing status
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Processing progress percentage
        estimated_completion:
          type: string
          format: date-time
          description: Estimated completion time
        error_message:
          type: string
          description: Error details if status is FAILED
      required:
        - session_id
        - status
        - progress

    ContentResponse:
      type: object
      properties:
        content_id:
          type: string
          format: uuid
          description: Unique content identifier
        caption:
          type: string
          maxLength: 2200
          description: Generated Instagram caption
        hashtags:
          type: array
          items:
            type: string
            pattern: '^#[a-zA-Z0-9_]+$'
          minItems: 10
          maxItems: 30
          description: Generated hashtags
        style:
          type: string
          enum: [casual, professional, engaging, funny]
          description: Caption style used
        confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: AI confidence in content quality
        generated_at:
          type: string
          format: date-time
          description: Content generation timestamp
        image_analysis:
          $ref: '#/components/schemas/ImageAnalysis'
      required:
        - content_id
        - caption
        - hashtags
        - style
        - confidence
        - generated_at

    ImageAnalysis:
      type: object
      properties:
        objects_detected:
          type: array
          items:
            type: string
          description: Objects and subjects identified in image
        scene_description:
          type: string
          description: Overall scene description
        style_tags:
          type: array
          items:
            type: string
          description: Visual style characteristics
        mood:
          type: string
          description: Emotional tone of the image
        colors:
          type: array
          items:
            type: string
            pattern: '^#[0-9A-Fa-f]{6}$'
          description: Dominant colors in hex format
      required:
        - objects_detected
        - scene_description
        - style_tags
        - mood
        - colors

    RegenerateResponse:
      type: object
      properties:
        regeneration_id:
          type: string
          format: uuid
          description: Unique regeneration request identifier
        status:
          type: string
          enum: [PROCESSING]
          description: Regeneration status
        estimated_completion:
          type: string
          format: date-time
          description: Estimated completion time
      required:
        - regeneration_id
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error type identifier
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error context
        timestamp:
          type: string
          format: date-time
          description: Error occurrence timestamp
      required:
        - error
        - message
        - timestamp

  securitySchemes:
    RateLimitByIP:
      type: apiKey
      in: header
      name: X-Rate-Limit-Token
      description: IP-based rate limiting (automatic)

security:
  - RateLimitByIP: []

tags:
  - name: Sessions
    description: Session management endpoints
  - name: Upload
    description: Image upload endpoints
  - name: Content
    description: Generated content endpoints